name: PremiosCS Workflow Prod

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  Create-envs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar se o repositorio e valido
        run: |
          echo "Repositorio PremiosCS verificado com sucesso."
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
